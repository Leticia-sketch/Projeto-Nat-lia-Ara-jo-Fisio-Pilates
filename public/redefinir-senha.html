<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Redefinir senha</title>
  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen flex overflow-hidden">

  <div class="hidden md:flex w-1/2 relative">
    <img src="img/studio4.jpeg" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-green-600/70 flex flex-col justify-center px-12 text-white">
      <h1 class="text-5xl font-light mb-4">Bem-vinda</h1>
      <p class="text-xl">Painel Administrativo</p>
      <p class="text-lg">Studio de Pilates</p>
    </div>
  </div>

  <div class="w-full md:w-1/2 flex items-center justify-center bg-[#f5f7f8]">
    <div class="w-full max-w-md">

      <div class="flex justify-center mb-6">
        <div class="bg-green-500 w-16 h-16 rounded-full flex items-center justify-center text-white text-2xl">
          🔒
        </div>
      </div>

      <h2 class="text-2xl font-semibold text-center mb-2">
        Redefinir senha
      </h2>

      <p id="subtitulo" class="text-center text-gray-500 mb-6">
        Escolha uma nova senha para acessar o painel
      </p>

      <form id="redefinirForm" class="space-y-4" novalidate>
        <div>
          <label>Nova senha</label>
          <input id="novaSenha" type="password" required minlength="6"
                 class="w-full border rounded-lg p-3" placeholder="••••••••">
        </div>

        <div>
          <label>Confirmar nova senha</label>
          <input id="confirmarSenha" type="password" required minlength="6"
                 class="w-full border rounded-lg p-3" placeholder="••••••••">
          <p id="erroSenha" class="text-red-500 text-sm mt-1 hidden"></p>
        </div>

        <button class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition">
          Redefinir senha
        </button>
      </form>

      <div id="mensagemSucesso" class="hidden mt-4 p-4 bg-green-50 text-green-700 rounded-lg text-sm text-center"></div>
      <div id="mensagemErro" class="hidden mt-4 p-4 bg-red-50 text-red-700 rounded-lg text-sm text-center"></div>

      <p class="text-center text-sm mt-6">
        <a href="login.html" class="text-green-600 hover:underline">Voltar para o login</a>
      </p>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const token = params.get("token")

    const form = document.getElementById("redefinirForm")
    const novaSenhaInput = document.getElementById("novaSenha")
    const confirmarSenhaInput = document.getElementById("confirmarSenha")
    const erroSenha = document.getElementById("erroSenha")
    const mensagemSucesso = document.getElementById("mensagemSucesso")
    const mensagemErro = document.getElementById("mensagemErro")
    const subtitulo = document.getElementById("subtitulo")

    if (!token) {
      form.classList.add("hidden")
      subtitulo.textContent = "Link inválido. Solicite uma nova redefinição de senha."
    }

    function validarConfirmacao() {
      if (confirmarSenhaInput.value !== novaSenhaInput.value) {
        confirmarSenhaInput.setCustomValidity("As senhas não coincidem")
      } else {
        confirmarSenhaInput.setCustomValidity("")
      }
    }

    novaSenhaInput.addEventListener("input", validarConfirmacao)
    confirmarSenhaInput.addEventListener("input", validarConfirmacao)

    form.addEventListener("submit", async function (e) {
      e.preventDefault()

      erroSenha.classList.add("hidden")
      mensagemErro.classList.add("hidden")

      validarConfirmacao()

      if (!form.checkValidity()) {
        erroSenha.textContent = confirmarSenhaInput.validationMessage || "Verifique os campos preenchidos"
        erroSenha.classList.remove("hidden")
        return
      }

      try {
        const resposta = await fetch("/auth/redefinir-senha", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, novaSenha: novaSenhaInput.value })
        })

        const dados = await resposta.json()

        if (resposta.ok) {
          form.classList.add("hidden")
          mensagemSucesso.textContent = "Senha redefinida com sucesso! Redirecionando para o login..."
          mensagemSucesso.classList.remove("hidden")
          setTimeout(() => { window.location.href = "login.html" }, 2500)
        } else {
          mensagemErro.textContent = dados.issues?.[0]?.message || dados.erro || "Erro ao redefinir senha"
          mensagemErro.classList.remove("hidden")
        }
      } catch (erro) {
        mensagemErro.textContent = "Erro ao conectar com o servidor"
        mensagemErro.classList.remove("hidden")
      }
    })
  </script>

</body>
</html>
